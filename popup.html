<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Tab Suspender</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <img class="logo" src="icons/icon32.png" alt="Logo">
        <div class="title-sub">
          <h1>Zen Suspender</h1>
          <div class="status-indicator">
            <span class="status-dot active"></span>
            <span id="status-text">Active</span>
          </div>
        </div>
      </div>
      <button id="settings-btn" title="Open Settings Dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Main Card Body -->
    <main class="main-content">
      <!-- Premium Power Button (Enable/Disable circular switch) -->
      <div class="power-container glass-panel">
        <button id="master-power-btn" class="power-btn active" title="Toggle Auto-Suspension">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="power-icon">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          <span class="power-glow"></span>
        </button>
        <div class="power-meta">
          <span id="power-status-title" class="status-label">Auto-Suspend Enabled</span>
          <span id="power-status-desc" class="status-desc">Protecting your active browser RAM</span>
        </div>
      </div>

      <!-- Live Pause Countdown Screen (Dynamically toggled via JS) -->
      <div id="pause-countdown-panel" class="pause-countdown-card glass-panel" style="display: none;">
        <div class="countdown-meta">
          <span class="countdown-label">TEMPORARY PAUSE ACTIVE</span>
          <h2 id="countdown-timer">00:00:00</h2>
        </div>
        <button id="resume-countdown-btn" class="resume-now-btn">
          <span>Resume Auto-Suspend</span>
          <span class="btn-glow-cyan"></span>
        </button>
      </div>

      <!-- Quick Pause Pills Grid -->
      <div id="quick-pause-grid" class="pause-pills-row glass-panel">
        <span class="section-micro-label">Quick Pause Auto-Suspension:</span>
        <div class="pills-container">
          <button class="pause-pill-btn" data-pause="10">10m</button>
          <button class="pause-pill-btn" data-pause="60">1h</button>
          <button class="pause-pill-btn" data-pause="300">5h</button>
          <button class="pause-pill-btn" data-pause="1440">24h</button>
        </div>
      </div>

      <!-- Auto-Suspend Interval Adjustment Slider (above idle timeout) -->
      <div class="slider-box glass-panel">
        <span class="slider-box-label">Idle Inactivity Interval</span>
        <div class="popup-slider-wrapper">
          <button id="popup-slider-left" class="arrow-adjust" title="Decrease timeout">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="popup-slider-center">
            <input type="range" id="timeout-slider" min="5" max="300" step="5" value="30">
            <span id="timeout-slider-display">30 Minutes</span>
          </div>
          <button id="popup-slider-right" class="arrow-adjust" title="Increase timeout">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>

      <!-- Action Button Grid -->
      <div class="actions-area">
        <button id="suspend-active-btn" class="action-btn primary-action">
          <span>Suspend Current Tab</span>
        </button>

        <div class="action-btn-row">
          <button id="suspend-others-btn" class="action-btn secondary-action" title="Suspend all other tabs in this window">
            <span>Suspend Others</span>
          </button>
          <button id="unsuspend-all-btn" class="action-btn secondary-action" title="Unsuspend all suspended tabs">
            <span>Unsuspend All</span>
          </button>
        </div>

        <button id="whitelist-btn" class="action-btn outline-action">
          <span>Never Suspend This Site</span>
        </button>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
